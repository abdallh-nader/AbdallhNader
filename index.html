<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abdallh Nader | Computer Science &amp; Developer</title>
  <meta name="description" content="Personal portfolio of Abdallh Nader, showcasing projects and development work.">
  <meta name="keywords" content="Abdallh Nader, portfolio, computer science, software developer, web development">
  <meta name="theme-color" content="#0b0f19">
  <!-- Update SITE_URL below once the site is published -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Abdallh Nader | Computer Science Graduate &amp; Developer">
  <meta property="og:description" content="Personal portfolio of Abdallh Nader, showcasing projects and development work.">
  <meta property="og:image" content="https://your-site-url.example/images/og-image.jpg">
  <meta property="og:url" content="https://your-site-url.example/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="profile.JPG">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated particle network (drawn by script.js) -->
  <canvas id="bg" aria-hidden="true"></canvas>

  <header class="site-header" id="header">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="#home" aria-label="Abdallh Nader">AN</a>
      <ul class="nav-links">
        <li><a href="#home" data-i18n="nav_home">Home</a></li>
        <li><a href="#about" data-i18n="nav_about">About</a></li>
        <li><a href="#projects" data-i18n="nav_projects">Projects</a></li>
        <li><a href="#contact" data-i18n="nav_contact">Contact</a></li>
      </ul>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <span aria-hidden="true">|</span>
        <button type="button" data-lang="ar" aria-pressed="false">AR</button>
      </div>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="hero-photo">
        <img src="profile.JPG" alt="Portrait of Abdallh Nader" width="320" height="320">
      </div>
      <div class="hero-text">
        <h1 data-i18n="name">Abdallh Nader</h1>
        <!-- Typewriter: phrases come from TEXT[lang].roles in script.js -->
        <p class="title" aria-live="off"><span id="typed">Computer Science Graduate</span><span class="caret" aria-hidden="true"></span></p>
        <p class="intro" data-i18n="intro"></p>
        <div class="hero-actions">
          <a class="btn" href="#projects" data-i18n="cta">View My Projects</a>
          <div class="social" data-social></div>
        </div>
      </div>
    </section>

    <section id="about" class="section reveal">
      <h2 data-i18n="about_h">About</h2>
      <p class="lead" data-i18n="about_p1"></p>
      <p class="lead" data-i18n="about_p2"></p>
      <div class="filters" id="filters" role="group" aria-label="Skill categories"></div>
      <ul class="skills" id="skills" aria-label="Skills"></ul>
    </section>

    <section id="projects" class="section reveal">
      <h2 data-i18n="projects_h">Projects</h2>
      <div class="grid" id="project-grid"></div>
    </section>

    <section id="contact" class="section reveal">
      <h2 data-i18n="contact_h">Let's Connect</h2>
      <p class="lead" data-i18n="contact_p"></p>
      <div class="contact-links" data-contact></div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 <span data-i18n="name">Abdallh Nader</span></p>
    <div class="social" data-social></div>
  </footer>

  <!-- Project details modal (filled by openModal() in script.js) -->
  <dialog id="modal" class="modal" aria-labelledby="m-title">
    <div class="modal-box glass">
      <button class="modal-close" type="button" id="m-close" aria-label="Close">&times;</button>
      <div class="modal-media"><img id="m-img" alt="" width="600" height="375"></div>
      <div class="modal-body">
        <h3 id="m-title"></h3>
        <p id="m-desc"></p>
        <h4 data-i18n="m_stack">Tech stack</h4>
        <ul class="badges" id="m-stack"></ul>
        <div class="modal-actions" id="m-actions"></div>
        <div class="preview" id="m-preview"></div>
      </div>
    </div>
  </dialog>

  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <button class="to-top" id="to-top" type="button" aria-label="Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <script src="script.js"></script>
</body>
</html>
